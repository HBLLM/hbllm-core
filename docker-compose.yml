# Local development compose stack ONLY.
# Never expose or deploy this file in production; use docker-compose.prod.yml for deployment.
version: '3.8'

services:
  hbllm-core:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - HBLLM_DATABASE_URL=${HBLLM_DATABASE_URL:-postgresql://hbllm:${POSTGRES_PASSWORD:-hbllm_dev_local}@postgres:5432/hbllm_brain}
      - HBLLM_REDIS_URL=${HBLLM_REDIS_URL:-redis://redis:6379/0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: hbllm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hbllm_dev_local}
      POSTGRES_DB: hbllm_brain
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
