[package]
name = "hbllm_compute"
version = "0.1.0"
edition = "2021"
description = "Universal SIMD compute kernels for HBLLM quantization and inference."

[lib]
name = "hbllm_compute"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.25", features = ["abi3-py311"] }
numpy = "0.25"

# Memory mapping for expert streaming
memmap2 = "0.9.0"

# Rayon for parallel expert processing
rayon = "1.8.0"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
neon = []
avx2 = []
mps = []
