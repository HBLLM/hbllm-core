[package]
name = "hbllm_structure_matcher"
version = "0.1.0"
edition = "2021"
description = "Native Relational Structure Matcher with ranked candidate alignment and systematicity scoring."

[lib]
name = "hbllm_structure_matcher"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12.1"
