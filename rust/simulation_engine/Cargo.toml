[package]
name = "hbllm_simulation_engine"
version = "0.1.0"
edition = "2021"
description = "Native Mental Simulation Engine with Rayon multi-threaded rollouts and geometric physics stability."

[lib]
name = "hbllm_simulation_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module", "abi3-py311"] }
rayon = "1.8.0"
blake3 = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12.1"
hbllm_hcir_graph = { path = "../hcir_graph" }

