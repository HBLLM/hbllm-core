[package]
name = "hbllm_network_utils"
version = "0.1.0"
edition = "2021"
description = "High-performance network primitives for HBLLM: circuit breaker and rate limiter."

[lib]
name = "hbllm_network_utils"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["abi3-py311"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
