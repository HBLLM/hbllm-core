version: "2.0.0"
authority: "docs/architecture/priors.md"
description: >-
  Minimal Spelke Core Knowledge and Active Inference innate bootstrap seed
  (Layer 1). Strictly domain-agnostic and task-agnostic: zero surface colors,
  game mechanics, puzzle shapes, bespoke action IDs, or linguistic aliases.

concepts:
  # §2.1 Spatiotemporal Objectness
  - id: prior_concept_cohesion
    label: spatiotemporal_cohesion
    domain: spelke_objectness
    definition: Bounded contiguous regions persist and move as cohesive wholes.
    confidence: 0.99
  - id: prior_concept_continuity
    label: spatiotemporal_continuity
    domain: spelke_objectness
    definition: Entities traverse continuous connected paths across time steps.
    confidence: 0.99
  - id: prior_concept_solidity
    label: solidity_and_occlusion
    domain: spelke_objectness
    definition: Distinct solid entities cannot co-occupy coordinates; disappearance behind an occluder preserves identity.
    confidence: 0.99
  - id: prior_concept_coord_invariance
    label: coordinate_translation_invariance
    domain: spelke_objectness
    definition: Entity identity and category membership are invariant under spatial translation.
    confidence: 0.99

  # §2.2 Elementary Spatial Physics & Topology
  - id: prior_concept_metric_space
    label: metric_manifold
    domain: spatial_topology
    definition: Space is equipped with L1 and L2 distance metrics over relative offsets.
    confidence: 0.99
  - id: prior_concept_adjacent
    label: relation_adjacent
    domain: spatial_topology
    definition: Two regions sharing an edge or boundary cell stand in an adjacency relation.
    confidence: 0.99
  - id: prior_concept_contained_in
    label: relation_contained_in
    domain: spatial_topology
    definition: An entity enclosed by a closed boundary stands in a containment relation.
    confidence: 0.99
  - id: prior_concept_separated
    label: relation_separated
    domain: spatial_topology
    definition: Regions partitioned by topological cut-sets have non-zero path separation.
    confidence: 0.99
  - id: prior_concept_inertia
    label: kinematic_inertia
    domain: spatial_topology
    definition: Moving entities maintain momentum vector until acted upon by collision or actuation.
    confidence: 0.95

  # §2.3 Agency & Intention
  - id: prior_concept_self_agency
    label: self_agency_attribution
    domain: agency_intention
    definition: Emitted motor commands correlate temporally and proximally with self-entity state deltas.
    confidence: 0.98
  - id: prior_concept_goal_agency
    label: intentional_agency_detection
    domain: agency_intention
    definition: Trajectories systematically curving away from passive inertia toward attractors indicate intentional agents.
    confidence: 0.95
  - id: prior_concept_collision_avoidance
    label: hazard_collision_avoidance
    domain: agency_intention
    definition: Agents avoid terminal transitions and intersecting lethal trajectory cones.
    confidence: 0.98

  # §2.4 Discrete Numerosity & Counting
  - id: prior_concept_numerosity
    label: discrete_numerosity_comparison
    domain: discrete_numerosity
    definition: Cardinality equality, subset, and difference relations compare finite discrete entity sets.
    confidence: 0.99
  - id: prior_concept_correspondence
    label: bijective_correspondence
    domain: discrete_numerosity
    definition: Entity identities persist across successive frames via minimal-cost bipartite assignment.
    confidence: 0.98

  # §2.5 Causal Structure & Active Inference
  - id: prior_concept_temporal_precedence
    label: causal_temporal_precedence
    domain: causal_active_inference
    definition: Causes strictly precede their physical effects with positive temporal delta.
    confidence: 0.99
  - id: prior_concept_pearl_do
    label: pearl_interventional_do_calculus
    domain: causal_active_inference
    definition: Active intervention do(action) differs from passive correlation and reveals structural mechanism.
    confidence: 0.99
  - id: prior_concept_expected_free_energy
    label: expected_free_energy_minimization
    domain: causal_active_inference
    definition: Policy selection balances expected subgoal utility against epistemic surprise reduction.
    confidence: 0.98

rules:
  - id: prior_rule_permanence_under_occlusion
    condition: "visible(entity) == False and neighbor_contiguous(occluder)"
    prediction: "state(entity) == occluded_persistent"
    domain: spelke_objectness
    confidence: 0.92
  - id: prior_rule_boundary_collision
    condition: "projected_coord == occupied_solid"
    prediction: "kinematic_velocity == deflected_or_blocked"
    domain: spatial_topology
    confidence: 0.95
  - id: prior_rule_cut_set_subgoal
    condition: "separated(ego, target) and partition_count >= 2"
    prediction: "require_intervening_boundary_traversal"
    domain: spatial_topology
    confidence: 0.94
  - id: prior_rule_motor_self_attribution
    condition: "do(motor_action) precedes proximal_delta(dt=1)"
    prediction: "entity_attribution == self_agent"
    domain: agency_intention
    confidence: 0.95
  - id: prior_rule_epistemic_probe_on_uncertainty
    condition: "epistemic_entropy > curiosity_threshold"
    prediction: "emit_counterfactual_fork_or_safe_probe"
    domain: causal_active_inference
    confidence: 0.90

skills:
  - id: prior_skill_count_entities
    skill_name: innate_count_entities
    description: Count connected entities and measure background distribution via Layer-0 ALU.
    parameters:
      - name: grid
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: count_entities
      target: "?grid"
    bytecode_stream:
      author: core_priors
      description: Invoke math.connected_components ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.connected_components
            params:
              grid: "$r0"
            bind: "$r1"
        - opcode: RETURN
          params:
            yield: ["$r1"]

  - id: prior_skill_detect_topology_cuts
    skill_name: innate_detect_topology_cuts
    description: Compute topological component separation via Layer-0 cut-set ALU.
    parameters:
      - name: grid
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: detect_topology_cuts
      target: "?grid"
    bytecode_stream:
      author: core_priors
      description: Invoke math.topology_cuts ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.topology_cuts
            params:
              grid: "$r0"
            bind: "$r1"
        - opcode: RETURN
          params:
            yield: ["$r1"]

  - id: prior_skill_detect_symmetry
    skill_name: innate_detect_symmetry
    description: Evaluate bilateral entity centroid symmetry via Layer-0 ALU.
    parameters:
      - name: grid
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: detect_symmetry
      target: "?grid"
    bytecode_stream:
      author: core_priors
      description: Invoke math.symmetry_score ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.symmetry_score
            params:
              grid: "$r0"
            bind: "$r1"
        - opcode: RETURN
          params:
            yield: ["$r1"]

  - id: prior_skill_compare_cardinality
    skill_name: innate_compare_cardinality
    description: Compare cardinality and set membership between two entity sets.
    parameters:
      - name: items_a
        required: true
      - name: items_b
        required: false
        default: []
    precondition_pattern: null
    postcondition_pattern:
      intent: compare_cardinality
      items_a: "?items_a"
    bytecode_stream:
      author: core_priors
      description: Invoke math.set_cardinality ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.set_cardinality
            params:
              items_a: "$r0"
              items_b: "$r1"
            bind: "$r2"
        - opcode: RETURN
          params:
            yield: ["$r2"]

  - id: prior_skill_counterfactual_probe
    skill_name: innate_counterfactual_probe
    description: Fork an isolated simulation branch to evaluate an interventional do(a) probe and roll back.
    parameters:
      - name: scenario
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: counterfactual_probe
      scenario: "?scenario"
    bytecode_stream:
      author: core_priors
      description: Pearl do(a) safe counterfactual rollout
      instructions:
        - opcode: FORK
          params:
            branch_name: prior_cf_probe
        - opcode: EXECUTE
          params:
            capability: world.predict_outcome
            params:
              scenario: "$r0"
              branch: prior_cf_probe
            bind: "$r1"
        - opcode: ROLLBACK
          params:
            branch_name: prior_cf_probe
        - opcode: RETURN
          params:
            yield: ["$r1"]

  - id: prior_skill_active_epistemic_inquiry
    skill_name: innate_active_epistemic_inquiry
    description: Query unresolved unknowns in graph memory or dispatch curiosity exploration.
    parameters:
      - name: topic
        required: false
        default: ""
    precondition_pattern:
      node_type: unknown
    postcondition_pattern:
      intent: resolve_uncertainty
      topic: "?topic"
    bytecode_stream:
      author: core_priors
      description: Unify unknowns and yield target for inquiry
      instructions:
        - opcode: UNIFY
          params:
            pattern:
              node_type: unknown
            bind: "$r0"
        - opcode: BRANCH
          params:
            condition: if_empty
            register: "$r0"
            target_label: inquiry_done
        - opcode: EXECUTE
          params:
            capability: world.assess_metacognitive_agency
            params:
              target: "$r0"
            bind: "$r1"
        - opcode: RETURN
          params:
            yield: ["$r1"]
          label: inquiry_done

  - id: prior_skill_geodesic_field
    skill_name: innate_geodesic_field
    description: Compute multi-source geodesic distance field over a spatial manifold via Layer-0 ALU.
    parameters:
      - name: grid
        required: true
      - name: goal_cells
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: geodesic_field
      target: "?grid"
    bytecode_stream:
      author: core_priors
      description: Invoke math.geodesic_field ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.geodesic_field
            params:
              grid: "$r0"
              goal_cells: "$r1"
            bind: "$r2"
        - opcode: RETURN
          params:
            yield: ["$r2"]

  - id: prior_skill_bellman_risk_backup
    skill_name: innate_bellman_risk_backup
    description: Evaluate risk-sensitive finite-horizon expected utility over stochastic dynamics via Layer-0 ALU.
    parameters:
      - name: grid_shape
        required: true
      - name: goal_cells
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: bellman_risk_backup
      target: "?grid_shape"
    bytecode_stream:
      author: core_priors
      description: Invoke math.bellman_risk_backup ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.bellman_risk_backup
            params:
              grid_shape: "$r0"
              goal_cells: "$r1"
            bind: "$r2"
        - opcode: RETURN
          params:
            yield: ["$r2"]

  - id: prior_skill_collision_cone
    skill_name: innate_collision_cone
    description: Project dynamic threat trajectories forward to detect collisions and swap hazards via Layer-0 ALU.
    parameters:
      - name: grid_shape
        required: true
      - name: avatar_trajectory
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: collision_cone
      target: "?avatar_trajectory"
    bytecode_stream:
      author: core_priors
      description: Invoke math.collision_cone ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.collision_cone
            params:
              grid_shape: "$r0"
              avatar_trajectory: "$r1"
            bind: "$r2"
        - opcode: RETURN
          params:
            yield: ["$r2"]

  - id: prior_skill_bayesian_posterior
    skill_name: innate_bayesian_posterior_update
    description: Update conjugate Dirichlet outcome posteriors and Expected Free Energy via Layer-0 ALU.
    parameters:
      - name: observations
        required: false
        default: []
    precondition_pattern: null
    postcondition_pattern:
      intent: bayesian_posterior_update
      observations: "?observations"
    bytecode_stream:
      author: core_priors
      description: Invoke math.bayesian_posterior_update ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.bayesian_posterior_update
            params:
              observations: "$r0"
            bind: "$r1"
        - opcode: RETURN
          params:
            yield: ["$r1"]

  - id: prior_skill_fuzzy_evaluate
    skill_name: innate_fuzzy_evaluate
    description: Evaluate a FuzzyExpr AST under an explicit FuzzyLogicProfile via Layer-0 ALU.
    parameters:
      - name: expr
        required: true
      - name: bindings
        required: false
        default: {}
      - name: profile_id
        required: false
        default: product
    precondition_pattern: null
    postcondition_pattern:
      intent: fuzzy_evaluate
      expr: "?expr"
    bytecode_stream:
      author: core_priors
      description: Invoke math.fuzzy.eval ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.fuzzy.eval
            params:
              expr: "$r0"
              bindings: "$r1"
              profile_id: "$r2"
            bind: "$r3"
        - opcode: RETURN
          params:
            yield: ["$r3"]

  - id: prior_skill_fuzzy_compose
    skill_name: innate_fuzzy_compose
    description: Compose two graded spatial relations via declarative RelationCompositionPolicy ALU.
    parameters:
      - name: first_relation
        required: true
      - name: second_relation
        required: true
      - name: degree_ab
        required: true
      - name: degree_bc
        required: true
    precondition_pattern: null
    postcondition_pattern:
      intent: fuzzy_compose
      first_relation: "?first_relation"
      second_relation: "?second_relation"
    bytecode_stream:
      author: core_priors
      description: Invoke math.fuzzy.compose ALU
      instructions:
        - opcode: EXECUTE
          params:
            capability: math.fuzzy.compose
            params:
              first_relation: "$r0"
              second_relation: "$r1"
              degree_ab: "$r2"
              degree_bc: "$r3"
            bind: "$r4"
        - opcode: RETURN
          params:
            yield: ["$r4"]

relation_composition_policy:
  policy_id: default_spatial_policy
  rules:
    - first_relation: inside
      second_relation: inside
      composed_relation: inside
      directionality: forward
      geometric_guard: topological_closure
      composition_operator: godel
      attenuation_factor: 1.0
    - first_relation: contains
      second_relation: contains
      composed_relation: contains
      directionality: forward
      geometric_guard: topological_closure
      composition_operator: godel
      attenuation_factor: 1.0
    - first_relation: above
      second_relation: above
      composed_relation: above
      directionality: directional_axis
      geometric_guard: directional_alignment
      composition_operator: product
      attenuation_factor: 1.0
    - first_relation: below
      second_relation: below
      composed_relation: below
      directionality: directional_axis
      geometric_guard: directional_alignment
      composition_operator: product
      attenuation_factor: 1.0
    - first_relation: left_of
      second_relation: left_of
      composed_relation: left_of
      directionality: directional_axis
      geometric_guard: directional_alignment
      composition_operator: product
      attenuation_factor: 1.0
    - first_relation: right_of
      second_relation: right_of
      composed_relation: right_of
      directionality: directional_axis
      geometric_guard: directional_alignment
      composition_operator: product
      attenuation_factor: 1.0
    - first_relation: supports
      second_relation: supports
      composed_relation: supports
      directionality: forward
      geometric_guard: none
      composition_operator: product
      attenuation_factor: 0.95
    - first_relation: supported_by
      second_relation: supported_by
      composed_relation: supported_by
      directionality: forward
      geometric_guard: none
      composition_operator: product
      attenuation_factor: 0.95
    - first_relation: on_top_of
      second_relation: on_top_of
      composed_relation: above
      directionality: directional_axis
      geometric_guard: directional_alignment
      composition_operator: product
      attenuation_factor: 0.95
    - first_relation: inside
      second_relation: near
      composed_relation: near
      directionality: forward
      geometric_guard: triangle_inequality_bound
      max_scale_ratio: 0.5
      composition_operator: attenuated_product
      attenuation_factor: 0.85
    - first_relation: near
      second_relation: inside
      composed_relation: null
      directionality: forward
      geometric_guard: extent_bounded
      max_scale_ratio: 1.5
      composition_operator: attenuated_product
      attenuation_factor: 0.5
    - first_relation: near
      second_relation: near
      composed_relation: null
      directionality: symmetric
      geometric_guard: none
      composition_operator: godel
      attenuation_factor: 0.0
    - first_relation: adjacent_to
      second_relation: adjacent_to
      composed_relation: null
      directionality: symmetric
      geometric_guard: none
      composition_operator: godel
      attenuation_factor: 0.0

edges:
  - id: prior_edge_cohesion_continuity
    edge_type: supports
    sources: [prior_concept_cohesion]
    targets: [prior_concept_continuity]
  - id: prior_edge_solidity_permanence
    edge_type: supports
    sources: [prior_concept_solidity]
    targets: [prior_rule_permanence_under_occlusion]
  - id: prior_edge_separated_cut_set
    edge_type: supports
    sources: [prior_concept_separated]
    targets: [prior_rule_cut_set_subgoal]
  - id: prior_edge_agency_attribution
    edge_type: supports
    sources: [prior_concept_self_agency]
    targets: [prior_rule_motor_self_attribution]
  - id: prior_edge_efe_inquiry
    edge_type: supports
    sources: [prior_concept_expected_free_energy]
    targets: [prior_skill_active_epistemic_inquiry]
  - id: prior_edge_do_cf
    edge_type: supports
    sources: [prior_concept_pearl_do]
    targets: [prior_skill_counterfactual_probe]
  - id: prior_edge_metric_geodesic
    edge_type: supports
    sources: [prior_concept_metric_space]
    targets: [prior_skill_geodesic_field]
  - id: prior_edge_metric_bellman
    edge_type: supports
    sources: [prior_concept_expected_free_energy]
    targets: [prior_skill_bellman_risk_backup]
  - id: prior_edge_collision_cone
    edge_type: supports
    sources: [prior_concept_collision_avoidance]
    targets: [prior_skill_collision_cone]
  - id: prior_edge_efe_bayesian
    edge_type: supports
    sources: [prior_concept_expected_free_energy]
    targets: [prior_skill_bayesian_posterior]
